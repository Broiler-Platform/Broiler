name: Prepare Broiler Preview Package

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to checkout recursively and package from.
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: broiler-preview-package-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  WINDOWS_CONFIGURATION: Release-Windows
  LINUX_CONFIGURATION: Release-Linux
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-windows-preview-package:
    name: Build BPP Win32 Packages
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BROWSER_PROJECT_PATH: src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj
      WRITER_PROJECT_PATH: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
      BOSS_PROJECT_PATH: Broiler.Office.Server/Broiler.Office.Server.csproj
      WRITER_CLIENT_PROJECT_PATH: src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the WebAssembly build workload
        shell: pwsh
        run: |
          # BOSS serves the Writer compiled to WebAssembly; publishing that client needs wasm-tools
          # (emscripten + the browser-wasm runtime packs).
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install wasm-tools exited with code $LASTEXITCODE."
          }

      - name: Restore Windows runtime graphs
        shell: pwsh
        run: |
          dotnet restore $env:BROWSER_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION
          dotnet restore $env:WRITER_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION
          dotnet restore $env:BOSS_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION

          # The Writer WebAssembly client is not a ProjectReference of BOSS — the server publishes it
          # through an MSBuild task and vendors the result — so it needs its own restore, and one
          # without the Windows RID: the client always targets browser-wasm.
          dotnet restore $env:WRITER_CLIENT_PROJECT_PATH -p:Configuration=$env:WINDOWS_CONFIGURATION

      - name: Build Windows targets
        shell: pwsh
        run: |
          dotnet build $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --no-restore

          dotnet build $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --no-restore

      - name: Publish Windows framework-dependent apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages\BPP-Win32-framework-dependent'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          # BOSS goes into its own subfolder: it ships a vendored wwwroot, an appsettings.json and a
          # service/ tree, none of which belong loose beside the desktop apps.
          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output (Join-Path $output 'BOSS') `
            -p:UseAppHost=true

      - name: Publish Windows self-contained apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages\BPP-Win32-self-contained'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output (Join-Path $output 'BOSS')

      - name: Assemble and smoke-test the BOSS payloads
        shell: pwsh
        run: |
          # Lay the README, launcher and service files around each published server, then start it
          # and check it really serves the Writer — a package whose wwwroot did not survive the
          # publish still starts and answers /healthz, so only a real request catches it.
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          $port = 5555

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $bossDir = Join-Path $packageParent "BPP-Win32-$variant\BOSS"

            ./scripts/package-boss.ps1 -BossDirectory $bossDir -Platform windows
            ./scripts/smoke-test-boss.ps1 -BossDirectory $bossDir -Port $port

            # A fresh port per variant: Windows can hold a listening socket in TIME_WAIT briefly
            # after the previous server exits.
            $port++
          }

      - name: Package Windows assets
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          function Rename-AppPublish {
            param(
              [Parameter(Mandatory=$true)][string]$Directory,
              [Parameter(Mandatory=$true)][string]$OriginalBaseName,
              [Parameter(Mandatory=$true)][string]$PackageBaseName,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$ExecutableExtension
            )

            $originalExecutable = Join-Path $Directory ($OriginalBaseName + $ExecutableExtension)
            $packageExecutable = Join-Path $Directory ($PackageBaseName + $ExecutableExtension)
            if ($originalExecutable -ne $packageExecutable -and (Test-Path -LiteralPath $originalExecutable)) {
              Move-Item -LiteralPath $originalExecutable -Destination $packageExecutable -Force
            }

            if (-not (Test-Path -LiteralPath $packageExecutable)) {
              throw "Expected packaged executable was not produced: $packageExecutable"
            }
          }

          function New-WindowsArchive {
            param(
              [Parameter(Mandatory=$true)][string]$PackageParent,
              [Parameter(Mandatory=$true)][string]$PackageName,
              [Parameter(Mandatory=$true)][string]$AssetDirectory
            )

            $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
            if ($sevenZip -ne $null) {
              $destination = Join-Path $AssetDirectory "$PackageName.7z"
              Push-Location $PackageParent
              try {
                & $sevenZip.Source a -t7z $destination $PackageName
                if ($LASTEXITCODE -ne 0) {
                  throw "7z exited with code $LASTEXITCODE."
                }
              }
              finally {
                Pop-Location
              }

              return
            }

            Compress-Archive `
              -LiteralPath (Join-Path $PackageParent $PackageName) `
              -DestinationPath (Join-Path $AssetDirectory "$PackageName.zip") `
              -Force
          }

          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $packageParent | Out-Null

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $packageName = "BPP-Win32-$variant"
            $packageRoot = Join-Path $packageParent $packageName

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Browser.Windows' `
              -PackageBaseName 'Broiler.Browser' `
              -ExecutableExtension '.exe'

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Writer.Windows' `
              -PackageBaseName 'Broiler.Writer' `
              -ExecutableExtension '.exe'

            ./scripts/write-bpp-build-info.ps1 `
              -PackageDirectory $packageRoot `
              -Platform windows `
              -Variant $variant `
              -Branch $env:RELEASE_BRANCH `
              -Configuration $env:WINDOWS_CONFIGURATION

            New-WindowsArchive `
              -PackageParent $packageParent `
              -PackageName $packageName `
              -AssetDirectory $assetDir
          }

      - name: Upload Win32 framework-dependent BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Win32-framework-dependent
          path: ${{ runner.temp }}/release-assets/BPP-Win32-framework-dependent.*
          if-no-files-found: error

      - name: Upload Win32 self-contained BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Win32-self-contained
          path: ${{ runner.temp }}/release-assets/BPP-Win32-self-contained.*
          if-no-files-found: error

  build-linux-preview-package:
    name: Build BPP Linux Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BROWSER_PROJECT_PATH: src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
      WRITER_PROJECT_PATH: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
      BOSS_PROJECT_PATH: Broiler.Office.Server/Broiler.Office.Server.csproj
      WRITER_CLIENT_PROJECT_PATH: src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the WebAssembly build workload
        shell: pwsh
        run: |
          # BOSS serves the Writer compiled to WebAssembly; publishing that client needs wasm-tools
          # (emscripten + the browser-wasm runtime packs).
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install wasm-tools exited with code $LASTEXITCODE."
          }

      - name: Restore Linux runtime graphs
        shell: pwsh
        run: |
          dotnet restore $env:BROWSER_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION
          dotnet restore $env:WRITER_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION
          dotnet restore $env:BOSS_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION

          # The Writer WebAssembly client is not a ProjectReference of BOSS — the server publishes it
          # through an MSBuild task and vendors the result — so it needs its own restore, and one
          # without the Linux RID: the client always targets browser-wasm.
          dotnet restore $env:WRITER_CLIENT_PROJECT_PATH -p:Configuration=$env:LINUX_CONFIGURATION

      - name: Build Linux targets
        shell: pwsh
        run: |
          dotnet build $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-restore

          dotnet build $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-restore

      - name: Run Linux offscreen smoke tests
        shell: pwsh
        run: |
          dotnet run `
            --project $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-build `
            -- `
            --offscreen `
            --duration-ms=1

          dotnet run `
            --project $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-build `
            -- `
            --offscreen `
            --duration-ms=1

      - name: Publish Linux framework-dependent apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages/BPP-Linux-framework-dependent'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          # BOSS goes into its own subfolder: it ships a vendored wwwroot, an appsettings.json and a
          # service/ tree, none of which belong loose beside the desktop apps.
          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output (Join-Path $output 'BOSS') `
            -p:UseAppHost=true

      - name: Publish Linux self-contained apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages/BPP-Linux-self-contained'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output (Join-Path $output 'BOSS')

      - name: Assemble and smoke-test the BOSS payloads
        shell: pwsh
        run: |
          # Lay the README, launcher and service files around each published server, then start it
          # and check it really serves the Writer — a package whose wwwroot did not survive the
          # publish still starts and answers /healthz, so only a real request catches it.
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          $port = 5555

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $bossDir = Join-Path $packageParent "BPP-Linux-$variant/BOSS"

            ./scripts/package-boss.ps1 -BossDirectory $bossDir -Platform linux
            ./scripts/smoke-test-boss.ps1 -BossDirectory $bossDir -Port $port

            $port++
          }

      - name: Package Linux assets
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          function Rename-AppPublish {
            param(
              [Parameter(Mandatory=$true)][string]$Directory,
              [Parameter(Mandatory=$true)][string]$OriginalBaseName,
              [Parameter(Mandatory=$true)][string]$PackageBaseName,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$ExecutableExtension
            )

            $originalExecutable = Join-Path $Directory ($OriginalBaseName + $ExecutableExtension)
            $packageExecutable = Join-Path $Directory ($PackageBaseName + $ExecutableExtension)
            if ($originalExecutable -ne $packageExecutable -and (Test-Path -LiteralPath $originalExecutable)) {
              Move-Item -LiteralPath $originalExecutable -Destination $packageExecutable -Force
            }

            if (-not (Test-Path -LiteralPath $packageExecutable)) {
              throw "Expected packaged executable was not produced: $packageExecutable"
            }

            chmod +x $packageExecutable
          }

          function New-LinuxArchive {
            param(
              [Parameter(Mandatory=$true)][string]$PackageParent,
              [Parameter(Mandatory=$true)][string]$PackageName,
              [Parameter(Mandatory=$true)][string]$AssetDirectory
            )

            if (Get-Command xz -ErrorAction SilentlyContinue) {
              tar -cJf (Join-Path $AssetDirectory "$PackageName.tar.xz") -C $PackageParent $PackageName
              if ($LASTEXITCODE -ne 0) {
                throw "tar.xz packaging exited with code $LASTEXITCODE."
              }

              return
            }

            tar -czf (Join-Path $AssetDirectory "$PackageName.tar.gz") -C $PackageParent $PackageName
            if ($LASTEXITCODE -ne 0) {
              throw "tar.gz packaging exited with code $LASTEXITCODE."
            }
          }

          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $packageParent | Out-Null

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $packageName = "BPP-Linux-$variant"
            $packageRoot = Join-Path $packageParent $packageName

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Browser.Linux' `
              -PackageBaseName 'Broiler.Browser' `
              -ExecutableExtension ''

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Writer.Linux' `
              -PackageBaseName 'Broiler.Writer' `
              -ExecutableExtension ''

            ./scripts/write-bpp-build-info.ps1 `
              -PackageDirectory $packageRoot `
              -Platform linux `
              -Variant $variant `
              -Branch $env:RELEASE_BRANCH `
              -Configuration $env:LINUX_CONFIGURATION

            New-LinuxArchive `
              -PackageParent $packageParent `
              -PackageName $packageName `
              -AssetDirectory $assetDir
          }

      - name: Upload Linux framework-dependent BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Linux-framework-dependent
          path: ${{ runner.temp }}/release-assets/BPP-Linux-framework-dependent.tar.*
          if-no-files-found: error

      - name: Upload Linux self-contained BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Linux-self-contained
          path: ${{ runner.temp }}/release-assets/BPP-Linux-self-contained.tar.*
          if-no-files-found: error

  create-preview-package-release:
    name: Create BPP Draft Release
    runs-on: ubuntu-24.04
    needs:
      - build-windows-preview-package
      - build-linux-preview-package
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Download package assets
        uses: actions/download-artifact@v7
        with:
          pattern: BPP-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          $branchSlug = $env:RELEASE_BRANCH -replace '[^A-Za-z0-9._-]+', '-'
          $branchSlug = $branchSlug.Trim('-')
          if ([string]::IsNullOrWhiteSpace($branchSlug)) {
            $branchSlug = 'branch'
          }

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $shortSha = (git rev-parse --short HEAD).Trim()
          $tagName = "broiler-preview-package-$branchSlug-$stamp-$env:GITHUB_RUN_NUMBER"
          $releaseTitle = "Broiler Preview Package draft ($env:RELEASE_BRANCH @ $shortSha)"

          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'

          function Resolve-Asset {
            param(
              [Parameter(Mandatory=$true)][string]$BaseName,
              [Parameter(Mandatory=$true)][string[]]$Extensions
            )

            foreach ($extension in $Extensions) {
              $candidate = Join-Path $assetDir ($BaseName + $extension)
              if (Test-Path -LiteralPath $candidate) {
                return $candidate
              }
            }

            throw "Missing expected BPP asset for $BaseName. Tried: $($Extensions -join ', ')"
          }

          $windowsFrameworkDependent = Resolve-Asset 'BPP-Win32-framework-dependent' @('.7z', '.zip')
          $windowsSelfContained = Resolve-Asset 'BPP-Win32-self-contained' @('.7z', '.zip')
          $linuxFrameworkDependent = Resolve-Asset 'BPP-Linux-framework-dependent' @('.tar.xz', '.tar.gz')
          $linuxSelfContained = Resolve-Asset 'BPP-Linux-self-contained' @('.tar.xz', '.tar.gz')

          $packages = @(
            $windowsFrameworkDependent,
            $windowsSelfContained,
            $linuxFrameworkDependent,
            $linuxSelfContained
          )

          foreach ($asset in $packages) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing expected BPP asset: $asset"
            }
          }

          # sha256sum-compatible manifest (hash, two spaces, file name) so `sha256sum -c` works as-is
          # after downloading the archives next to it.
          $checksumPath = Join-Path $assetDir 'SHA256SUMS.txt'
          $checksumLines = $packages | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $_)
          }
          Set-Content -LiteralPath $checksumPath -Value $checksumLines -Encoding ascii

          $assetList = ($packages + $checksumPath) | ForEach-Object { "- " + (Split-Path -Leaf $_) }

          # Single-quoted here-string: the notes are full of Markdown backticks, and in an
          # interpolating string PowerShell would eat them as escape characters.
          $contents = @'
          Each package contains:

          * `Broiler.Browser` — the Broiler web browser.
          * `Broiler.Writer` — the Broiler word processor (desktop).
          * `BOSS/` — **Broiler Office Standalone Server**: a Kestrel host that serves the Broiler
            Writer web app (WebAssembly), so the Writer runs in a browser with no other web server
            involved.

          Starting BOSS after extracting a package:

          ```
          ./BOSS/run-boss.sh --urls http://0.0.0.0:5555        # Linux
          BOSS\Start-BOSS.cmd                                  # Windows
          ```

          Then open <http://localhost:5555/>. Liveness probe at `/healthz`, server details at
          `/api/info`.

          To keep it serving across reboots, `BOSS/service/` carries prepared unit files and
          installers — a hardened systemd unit (`Type=notify`), an LSB SysV init script, a Windows
          service installer, plus nginx and Apache reverse-proxy samples:

          ```
          sudo ./BOSS/service/install-service.sh --urls http://0.0.0.0:5555
          powershell -ExecutionPolicy Bypass -File BOSS\service\Install-BossService.ps1 -OpenFirewall
          ```

          Full documentation ships in the package: `BOSS/README.md` and `BOSS/service/README.md`.
          Each package root also carries a `BUILD-INFO.txt` naming the branch, commit and build time.

          Variants:

          * **self-contained** — carries its own .NET runtime; nothing to install.
          * **framework-dependent** — smaller, needs the .NET 10 desktop runtime and, for BOSS, the
            ASP.NET Core 10 runtime on the target machine.
          '@

          $verify = @'
          Verify a download against `SHA256SUMS.txt`:

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing        # Linux
          Get-FileHash .\BPP-Win32-self-contained.7z -Algorithm SHA256   # Windows
          ```
          '@

          $body = @(
            "Draft Broiler Preview Package prepared from branch $env:RELEASE_BRANCH at commit $env:SHORT_SHA.",
            '',
            $contents,
            '',
            'Assets:',
            ($assetList -join "`n"),
            '',
            $verify
          ) -join "`n"

          $bodyPath = Join-Path $env:RUNNER_TEMP 'broiler-preview-package-notes.md'
          Set-Content -LiteralPath $bodyPath -Value $body -Encoding UTF8

          gh release create $env:TAG_NAME `
            $windowsFrameworkDependent `
            $windowsSelfContained `
            $linuxFrameworkDependent `
            $linuxSelfContained `
            $checksumPath `
            --draft `
            --target $env:RELEASE_BRANCH `
            --title $env:RELEASE_TITLE `
            --notes-file $bodyPath
