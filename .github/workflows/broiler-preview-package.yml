name: Prepare Broiler Preview Package

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to checkout recursively and package from.
        required: true
        default: main

permissions:
  contents: write

concurrency:
  group: broiler-preview-package-${{ github.event.inputs.branch }}
  cancel-in-progress: false

env:
  WINDOWS_CONFIGURATION: Release-Windows
  LINUX_CONFIGURATION: Release-Linux
  # Plain Release, not a Release-Android to match the desktop pair: the Android heads switch
  # AndroidPackageFormat to aab on '$(Configuration)' == 'Release' exactly, so any other
  # configuration name quietly produces an APK instead.
  ANDROID_CONFIGURATION: Release
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-windows-preview-package:
    name: Build BPP Win32 Packages
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      BROWSER_PROJECT_PATH: src/Broiler.Browser.Windows/Broiler.Browser.Windows.csproj
      WRITER_PROJECT_PATH: src/Broiler.Writer.Windows/Broiler.Writer.Windows.csproj
      BOSS_PROJECT_PATH: Broiler.Office.Server/Broiler.Office.Server.csproj
      WRITER_CLIENT_PROJECT_PATH: src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the WebAssembly build workload
        shell: pwsh
        run: |
          # BOSS serves the Writer compiled to WebAssembly; publishing that client needs wasm-tools
          # (emscripten + the browser-wasm runtime packs).
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install wasm-tools exited with code $LASTEXITCODE."
          }

      - name: Restore Windows runtime graphs
        shell: pwsh
        run: |
          dotnet restore $env:BROWSER_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION
          dotnet restore $env:WRITER_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION
          dotnet restore $env:BOSS_PROJECT_PATH --runtime win-x64 -p:Configuration=$env:WINDOWS_CONFIGURATION

          # The Writer WebAssembly client is not a ProjectReference of BOSS — the server publishes it
          # through an MSBuild task and vendors the result — so it needs its own restore, and one
          # without the Windows RID: the client always targets browser-wasm.
          dotnet restore $env:WRITER_CLIENT_PROJECT_PATH -p:Configuration=$env:WINDOWS_CONFIGURATION

      - name: Build Windows targets
        shell: pwsh
        run: |
          dotnet build $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --no-restore

          dotnet build $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --no-restore

      - name: Publish Windows framework-dependent apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages\BPP-Win32-framework-dependent'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          # BOSS goes into its own subfolder: it ships a vendored wwwroot, an appsettings.json and a
          # service/ tree, none of which belong loose beside the desktop apps.
          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained false `
            --no-restore `
            --output (Join-Path $output 'BOSS') `
            -p:UseAppHost=true

      - name: Publish Windows self-contained apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages\BPP-Win32-self-contained'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0-windows `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:WINDOWS_CONFIGURATION `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output (Join-Path $output 'BOSS')

      - name: Assemble and smoke-test the BOSS payloads
        shell: pwsh
        run: |
          # Lay the README, launcher and service files around each published server, then start it
          # and check it really serves the Writer — a package whose wwwroot did not survive the
          # publish still starts and answers /healthz, so only a real request catches it.
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          $port = 5555

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $bossDir = Join-Path $packageParent "BPP-Win32-$variant\BOSS"

            ./scripts/package-boss.ps1 -BossDirectory $bossDir -Platform windows
            ./scripts/smoke-test-boss.ps1 -BossDirectory $bossDir -Port $port

            # A fresh port per variant: Windows can hold a listening socket in TIME_WAIT briefly
            # after the previous server exits.
            $port++
          }

      - name: Package Windows assets
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          function Rename-AppPublish {
            param(
              [Parameter(Mandatory=$true)][string]$Directory,
              [Parameter(Mandatory=$true)][string]$OriginalBaseName,
              [Parameter(Mandatory=$true)][string]$PackageBaseName,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$ExecutableExtension
            )

            $originalExecutable = Join-Path $Directory ($OriginalBaseName + $ExecutableExtension)
            $packageExecutable = Join-Path $Directory ($PackageBaseName + $ExecutableExtension)
            if ($originalExecutable -ne $packageExecutable -and (Test-Path -LiteralPath $originalExecutable)) {
              Move-Item -LiteralPath $originalExecutable -Destination $packageExecutable -Force
            }

            if (-not (Test-Path -LiteralPath $packageExecutable)) {
              throw "Expected packaged executable was not produced: $packageExecutable"
            }
          }

          function New-WindowsArchive {
            param(
              [Parameter(Mandatory=$true)][string]$PackageParent,
              [Parameter(Mandatory=$true)][string]$PackageName,
              [Parameter(Mandatory=$true)][string]$AssetDirectory
            )

            $sevenZip = Get-Command 7z -ErrorAction SilentlyContinue
            if ($sevenZip -ne $null) {
              $destination = Join-Path $AssetDirectory "$PackageName.7z"
              Push-Location $PackageParent
              try {
                & $sevenZip.Source a -t7z $destination $PackageName
                if ($LASTEXITCODE -ne 0) {
                  throw "7z exited with code $LASTEXITCODE."
                }
              }
              finally {
                Pop-Location
              }

              return
            }

            Compress-Archive `
              -LiteralPath (Join-Path $PackageParent $PackageName) `
              -DestinationPath (Join-Path $AssetDirectory "$PackageName.zip") `
              -Force
          }

          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $packageParent | Out-Null

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $packageName = "BPP-Win32-$variant"
            $packageRoot = Join-Path $packageParent $packageName

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Browser.Windows' `
              -PackageBaseName 'Broiler.Browser' `
              -ExecutableExtension '.exe'

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Writer.Windows' `
              -PackageBaseName 'Broiler.Writer' `
              -ExecutableExtension '.exe'

            ./scripts/write-bpp-build-info.ps1 `
              -PackageDirectory $packageRoot `
              -Platform windows `
              -Variant $variant `
              -Branch $env:RELEASE_BRANCH `
              -Configuration $env:WINDOWS_CONFIGURATION

            New-WindowsArchive `
              -PackageParent $packageParent `
              -PackageName $packageName `
              -AssetDirectory $assetDir
          }

      - name: Upload Win32 framework-dependent BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Win32-framework-dependent
          path: ${{ runner.temp }}/release-assets/BPP-Win32-framework-dependent.*
          if-no-files-found: error

      - name: Upload Win32 self-contained BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Win32-self-contained
          path: ${{ runner.temp }}/release-assets/BPP-Win32-self-contained.*
          if-no-files-found: error

  build-linux-preview-package:
    name: Build BPP Linux Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      BROWSER_PROJECT_PATH: src/Broiler.Browser.Linux/Broiler.Browser.Linux.csproj
      WRITER_PROJECT_PATH: src/Broiler.Writer.Linux/Broiler.Writer.Linux.csproj
      BOSS_PROJECT_PATH: Broiler.Office.Server/Broiler.Office.Server.csproj
      WRITER_CLIENT_PROJECT_PATH: src/Broiler.Writer.WebAssembly/Broiler.Writer.WebAssembly.csproj

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install the WebAssembly build workload
        shell: pwsh
        run: |
          # BOSS serves the Writer compiled to WebAssembly; publishing that client needs wasm-tools
          # (emscripten + the browser-wasm runtime packs).
          dotnet workload install wasm-tools
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install wasm-tools exited with code $LASTEXITCODE."
          }

      - name: Restore Linux runtime graphs
        shell: pwsh
        run: |
          dotnet restore $env:BROWSER_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION
          dotnet restore $env:WRITER_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION
          dotnet restore $env:BOSS_PROJECT_PATH --runtime linux-x64 -p:Configuration=$env:LINUX_CONFIGURATION

          # The Writer WebAssembly client is not a ProjectReference of BOSS — the server publishes it
          # through an MSBuild task and vendors the result — so it needs its own restore, and one
          # without the Linux RID: the client always targets browser-wasm.
          dotnet restore $env:WRITER_CLIENT_PROJECT_PATH -p:Configuration=$env:LINUX_CONFIGURATION

      - name: Build Linux targets
        shell: pwsh
        run: |
          dotnet build $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-restore

          dotnet build $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-restore

      - name: Run Linux offscreen smoke tests
        shell: pwsh
        run: |
          dotnet run `
            --project $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-build `
            -- `
            --offscreen `
            --duration-ms=1

          dotnet run `
            --project $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --no-build `
            -- `
            --offscreen `
            --duration-ms=1

      - name: Publish Linux framework-dependent apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages/BPP-Linux-framework-dependent'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output $output `
            -p:UseAppHost=true

          # BOSS goes into its own subfolder: it ships a vendored wwwroot, an appsettings.json and a
          # service/ tree, none of which belong loose beside the desktop apps.
          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained false `
            --no-restore `
            --output (Join-Path $output 'BOSS') `
            -p:UseAppHost=true

      - name: Publish Linux self-contained apps
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'packages/BPP-Linux-self-contained'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:WRITER_PROJECT_PATH `
            --framework net10.0 `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output $output

          dotnet publish $env:BOSS_PROJECT_PATH `
            --configuration $env:LINUX_CONFIGURATION `
            --runtime linux-x64 `
            --self-contained true `
            --no-restore `
            --output (Join-Path $output 'BOSS')

      - name: Assemble and smoke-test the BOSS payloads
        shell: pwsh
        run: |
          # Lay the README, launcher and service files around each published server, then start it
          # and check it really serves the Writer — a package whose wwwroot did not survive the
          # publish still starts and answers /healthz, so only a real request catches it.
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          $port = 5555

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $bossDir = Join-Path $packageParent "BPP-Linux-$variant/BOSS"

            ./scripts/package-boss.ps1 -BossDirectory $bossDir -Platform linux
            ./scripts/smoke-test-boss.ps1 -BossDirectory $bossDir -Port $port

            $port++
          }

      - name: Package Linux assets
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          function Rename-AppPublish {
            param(
              [Parameter(Mandatory=$true)][string]$Directory,
              [Parameter(Mandatory=$true)][string]$OriginalBaseName,
              [Parameter(Mandatory=$true)][string]$PackageBaseName,
              [Parameter(Mandatory=$true)][AllowEmptyString()][string]$ExecutableExtension
            )

            $originalExecutable = Join-Path $Directory ($OriginalBaseName + $ExecutableExtension)
            $packageExecutable = Join-Path $Directory ($PackageBaseName + $ExecutableExtension)
            if ($originalExecutable -ne $packageExecutable -and (Test-Path -LiteralPath $originalExecutable)) {
              Move-Item -LiteralPath $originalExecutable -Destination $packageExecutable -Force
            }

            if (-not (Test-Path -LiteralPath $packageExecutable)) {
              throw "Expected packaged executable was not produced: $packageExecutable"
            }

            chmod +x $packageExecutable
          }

          function New-LinuxArchive {
            param(
              [Parameter(Mandatory=$true)][string]$PackageParent,
              [Parameter(Mandatory=$true)][string]$PackageName,
              [Parameter(Mandatory=$true)][string]$AssetDirectory
            )

            if (Get-Command xz -ErrorAction SilentlyContinue) {
              tar -cJf (Join-Path $AssetDirectory "$PackageName.tar.xz") -C $PackageParent $PackageName
              if ($LASTEXITCODE -ne 0) {
                throw "tar.xz packaging exited with code $LASTEXITCODE."
              }

              return
            }

            tar -czf (Join-Path $AssetDirectory "$PackageName.tar.gz") -C $PackageParent $PackageName
            if ($LASTEXITCODE -ne 0) {
              throw "tar.gz packaging exited with code $LASTEXITCODE."
            }
          }

          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          New-Item -ItemType Directory -Force -Path $packageParent | Out-Null

          foreach ($variant in @('framework-dependent', 'self-contained')) {
            $packageName = "BPP-Linux-$variant"
            $packageRoot = Join-Path $packageParent $packageName

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Browser.Linux' `
              -PackageBaseName 'Broiler.Browser' `
              -ExecutableExtension ''

            Rename-AppPublish `
              -Directory $packageRoot `
              -OriginalBaseName 'Broiler.Writer.Linux' `
              -PackageBaseName 'Broiler.Writer' `
              -ExecutableExtension ''

            ./scripts/write-bpp-build-info.ps1 `
              -PackageDirectory $packageRoot `
              -Platform linux `
              -Variant $variant `
              -Branch $env:RELEASE_BRANCH `
              -Configuration $env:LINUX_CONFIGURATION

            New-LinuxArchive `
              -PackageParent $packageParent `
              -PackageName $packageName `
              -AssetDirectory $assetDir
          }

      - name: Upload Linux framework-dependent BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Linux-framework-dependent
          path: ${{ runner.temp }}/release-assets/BPP-Linux-framework-dependent.tar.*
          if-no-files-found: error

      - name: Upload Linux self-contained BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Linux-self-contained
          path: ${{ runner.temp }}/release-assets/BPP-Linux-self-contained.tar.*
          if-no-files-found: error

  build-android-preview-package:
    name: Build BPP Android Package
    runs-on: ubuntu-24.04
    # Four publishes rather than the two this job started with: a bundle and an arm64 APK per head.
    timeout-minutes: 150
    outputs:
      # The signing certificate's fingerprint, for the release notes to publish. A certificate is
      # public by construction — this is what a download is checked against, not key material.
      signing-certificate-sha256: ${{ steps.sign-android-packages.outputs.certificate-sha256 }}
    env:
      BROWSER_PROJECT_PATH: src/Broiler.Browser.Android/Broiler.Browser.Android.csproj
      WRITER_PROJECT_PATH: src/Broiler.Writer.Android/Broiler.Writer.Android.csproj
      # The compile API and the build-tools track the android workload's Microsoft.Android.Sdk
      # major; bump them together with scripts/install-android-sdk.sh.
      ANDROID_API_LEVEL: '36'
      ANDROID_BUILD_TOOLS: 36.0.0

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup the JDK the Android SDK tooling runs on
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check the Android signing secrets
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Signing is what turns the publish output into a shippable package, so the secrets it
          # needs are checked before the hour of building rather than after it.
          ./scripts/sign-android-packages.ps1 -ValidateOnly | Out-Null

      - name: Install the Android build workload
        shell: pwsh
        run: |
          # net10.0-android needs the android workload: the Mono runtime packs for the device ABIs
          # plus the MSBuild targets that turn a publish into an app bundle.
          dotnet workload install android
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet workload install android exited with code $LASTEXITCODE."
          }

      - name: Provision the Android SDK
        shell: pwsh
        run: |
          # ubuntu-24.04 runners ship an Android SDK, but not necessarily the API level the heads
          # compile against — install what is missing rather than a second SDK beside it.
          $sdkRoot = $env:ANDROID_HOME
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            $sdkRoot = $env:ANDROID_SDK_ROOT
          }
          if ([string]::IsNullOrWhiteSpace($sdkRoot)) {
            throw "Neither ANDROID_HOME nor ANDROID_SDK_ROOT is set; this runner has no Android SDK."
          }

          $platformJar = Join-Path $sdkRoot "platforms/android-$env:ANDROID_API_LEVEL/android.jar"
          if (-not (Test-Path -LiteralPath $platformJar)) {
            $sdkManager = Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager'
            if (-not (Test-Path -LiteralPath $sdkManager)) {
              throw "The Android SDK at $sdkRoot has no API $env:ANDROID_API_LEVEL and no sdkmanager to install it with."
            }

            # The runner image pre-accepts licenses; feeding 'y' anyway keeps a package the image
            # has not seen from blocking on a prompt.
            ("y`n" * 50) | & $sdkManager --sdk_root="$sdkRoot" --licenses | Out-Null
            & $sdkManager --sdk_root="$sdkRoot" `
              "platforms;android-$env:ANDROID_API_LEVEL" `
              "build-tools;$env:ANDROID_BUILD_TOOLS"
          }

          if (-not (Test-Path -LiteralPath $platformJar)) {
            throw "android.jar is missing after provisioning: $platformJar"
          }

          "ANDROID_HOME=$sdkRoot" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdkRoot" >> $env:GITHUB_ENV

      - name: Restore Android runtime graphs
        shell: pwsh
        run: |
          # No --runtime: the heads declare RuntimeIdentifiers (android-arm64;android-x64) and one
          # bundle carries both ABIs, so the restore has to cover the whole set.
          dotnet restore $env:BROWSER_PROJECT_PATH -p:Configuration=$env:ANDROID_CONFIGURATION
          dotnet restore $env:WRITER_PROJECT_PATH -p:Configuration=$env:ANDROID_CONFIGURATION

      - name: Publish Android app bundles
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:RUNNER_TEMP 'android-publish'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --configuration $env:ANDROID_CONFIGURATION `
            --no-restore `
            --output (Join-Path $publishRoot 'browser')

          dotnet publish $env:WRITER_PROJECT_PATH `
            --configuration $env:ANDROID_CONFIGURATION `
            --no-restore `
            --output (Join-Path $publishRoot 'writer')

      - name: Publish the arm64 Release APKs
        shell: pwsh
        run: |
          # The same Release configuration as the bundles, with two properties overridden. They go
          # on the command line, where they become global properties and so win over the csproj:
          #
          #   AndroidPackageFormat  the heads switch to aab on '$(Configuration)' == 'Release', and
          #                         this package is the directly installable counterpart.
          #   RuntimeIdentifiers    an APK carries one ABI where a bundle carries the split set;
          #                         arm64-v8a is the ABI real devices run.
          #
          # No restore of its own: android-arm64 is part of the RuntimeIdentifiers already restored
          # above, so --no-restore is still honest. Restoring the narrower set here would rewrite
          # project.assets.json and break the bundle publish's own --no-restore.
          $publishRoot = Join-Path $env:RUNNER_TEMP 'android-publish'

          dotnet publish $env:BROWSER_PROJECT_PATH `
            --configuration $env:ANDROID_CONFIGURATION `
            --no-restore `
            -p:AndroidPackageFormat=apk `
            -p:RuntimeIdentifiers=android-arm64 `
            --output (Join-Path $publishRoot 'browser-arm64-apk')

          dotnet publish $env:WRITER_PROJECT_PATH `
            --configuration $env:ANDROID_CONFIGURATION `
            --no-restore `
            -p:AndroidPackageFormat=apk `
            -p:RuntimeIdentifiers=android-arm64 `
            --output (Join-Path $publishRoot 'writer-arm64-apk')

      - name: Collect and verify the Android packages
        shell: pwsh
        run: |
          # Either publish leaves the unsigned <applicationId> package beside a -Signed pair
          # carrying the workload's debug key. The unsigned one is what to carry forward — the next
          # step signs it with the release key, and a debug-signed package would arrive looking
          # release-ready when it is not.
          function Get-UnsignedPackage {
            param(
              [Parameter(Mandatory=$true)][string]$PublishDirectory,
              [Parameter(Mandatory=$true)][string]$ApplicationId,
              [Parameter(Mandatory=$true)][string]$Extension
            )

            $package = Join-Path $PublishDirectory "$ApplicationId$Extension"
            if (-not (Test-Path -LiteralPath $package)) {
              $produced = @(Get-ChildItem -LiteralPath $PublishDirectory -Filter "*$Extension" -ErrorAction SilentlyContinue |
                ForEach-Object { $_.Name })
              $found = if ($produced) { $produced -join ', ' } else { '(none)' }
              throw "Expected $ApplicationId$Extension in $PublishDirectory. Packages produced: $found"
            }

            return $package
          }

          function Get-ArchiveEntries {
            param([Parameter(Mandatory=$true)][string]$Path)

            $archive = [System.IO.Compression.ZipFile]::OpenRead($Path)
            try {
              return @($archive.Entries | ForEach-Object { $_.FullName })
            }
            finally {
              $archive.Dispose()
            }
          }

          function Assert-Unsigned {
            param(
              [Parameter(Mandatory=$true)][string]$Path,
              [Parameter(Mandatory=$true)][AllowEmptyCollection()][string[]]$Entries
            )

            # Signing happens in the next step, against the release key. A signature already here
            # means the debug-signed package was picked up by mistake.
            $signature = @($Entries | Where-Object { $_ -match '^META-INF/.+\.(RSA|DSA|EC|SF)$' })
            if ($signature) {
              throw "$Path is already signed ($($signature -join ', ')); the debug-signed package was picked up instead of the unsigned one."
            }
          }

          function Assert-AndroidAppBundle {
            param([Parameter(Mandatory=$true)][string]$Path)

            $entries = @(Get-ArchiveEntries -Path $Path)

            # An .aab is a protobuf bundle, not an APK. BundleConfig.pb and the base/ split are what
            # tell the two apart, so a wrong AndroidPackageFormat cannot ship unnoticed.
            foreach ($required in @('BundleConfig.pb', 'base/manifest/AndroidManifest.xml')) {
              if ($entries -notcontains $required) {
                throw "$Path is not an Android app bundle: $required is missing."
              }
            }

            foreach ($abi in @('arm64-v8a', 'x86_64')) {
              if (-not ($entries | Where-Object { $_.StartsWith("base/lib/$abi/") })) {
                throw "$Path carries no $abi native code."
              }
            }

            Assert-Unsigned -Path $Path -Entries $entries

            $megabytes = [Math]::Round((Get-Item -LiteralPath $Path).Length / 1MB, 1)
            Write-Host "==> verified $(Split-Path -Leaf $Path): app bundle, $($entries.Count) entries, $megabytes MB, unsigned publish output"
          }

          function Assert-AndroidArm64Apk {
            param([Parameter(Mandatory=$true)][string]$Path)

            $entries = @(Get-ArchiveEntries -Path $Path)

            # The mirror of the bundle's check: an APK keeps its manifest at the archive root and
            # has no BundleConfig.pb, so neither format can ship under the other one's name.
            if ($entries -notcontains 'AndroidManifest.xml') {
              throw "$Path is not an APK: AndroidManifest.xml is missing from the archive root."
            }

            if ($entries -contains 'BundleConfig.pb') {
              throw "$Path is an app bundle, not an APK; AndroidPackageFormat did not take."
            }

            # One ABI is the point of this package: an installable arm64 build. A second one means
            # the RuntimeIdentifiers override did not take, and the download would be twice the size
            # it needs to be.
            $abis = @($entries |
              ForEach-Object { if ($_ -match '^lib/([^/]+)/.') { $Matches[1] } } |
              Sort-Object -Unique)
            if ($abis.Count -ne 1 -or $abis[0] -ne 'arm64-v8a') {
              $found = if ($abis.Count -gt 0) { $abis -join ', ' } else { '(none)' }
              throw "$Path should carry arm64-v8a native code and nothing else; found: $found."
            }

            Assert-Unsigned -Path $Path -Entries $entries

            $megabytes = [Math]::Round((Get-Item -LiteralPath $Path).Length / 1MB, 1)
            Write-Host "==> verified $(Split-Path -Leaf $Path): apk, arm64-v8a, $($entries.Count) entries, $megabytes MB, unsigned publish output"
          }

          $publishRoot = Join-Path $env:RUNNER_TEMP 'android-publish'
          $packageRoot = Join-Path $env:RUNNER_TEMP 'packages/BPP-Android'
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          $heads = @(
            @{ Directory = 'browser'; ApplicationId = 'org.broiler.browser'; BundleName = 'Broiler.Browser.aab'; ApkName = 'Broiler.Browser-arm64.apk' }
            @{ Directory = 'writer'; ApplicationId = 'org.broiler.writer'; BundleName = 'Broiler.Writer.aab'; ApkName = 'Broiler.Writer-arm64.apk' }
          )

          foreach ($head in $heads) {
            $bundle = Get-UnsignedPackage `
              -PublishDirectory (Join-Path $publishRoot $head.Directory) `
              -ApplicationId $head.ApplicationId `
              -Extension '.aab'

            Assert-AndroidAppBundle -Path $bundle
            Copy-Item -LiteralPath $bundle -Destination (Join-Path $packageRoot $head.BundleName) -Force

            $apk = Get-UnsignedPackage `
              -PublishDirectory (Join-Path $publishRoot "$($head.Directory)-arm64-apk") `
              -ApplicationId $head.ApplicationId `
              -Extension '.apk'

            Assert-AndroidArm64Apk -Path $apk
            Copy-Item -LiteralPath $apk -Destination (Join-Path $packageRoot $head.ApkName) -Force
          }

      - name: Sign the Android packages
        id: sign-android-packages
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # The copies in the package root are signed, not the publish output: what ships is what
          # was verified. Bundles go through jarsigner and APKs through zipalign and apksigner —
          # the tool each format is checked by. The script verifies every signature against the
          # release certificate and returns its SHA-256 fingerprint, which BUILD-INFO.txt and the
          # release notes quote so a download can be checked.
          $packageRoot = Join-Path $env:RUNNER_TEMP 'packages/BPP-Android'

          $fingerprint = ./scripts/sign-android-packages.ps1 `
            -BundlePath `
              (Join-Path $packageRoot 'Broiler.Browser.aab'), `
              (Join-Path $packageRoot 'Broiler.Writer.aab') `
            -ApkPath `
              (Join-Path $packageRoot 'Broiler.Browser-arm64.apk'), `
              (Join-Path $packageRoot 'Broiler.Writer-arm64.apk')

          if ([string]::IsNullOrWhiteSpace($fingerprint)) {
            throw 'The signing script returned no certificate fingerprint.'
          }

          "ANDROID_SIGNING_CERT_SHA256=$fingerprint" >> $env:GITHUB_ENV
          "certificate-sha256=$fingerprint" >> $env:GITHUB_OUTPUT

      - name: Package Android assets
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'
          $packageParent = Join-Path $env:RUNNER_TEMP 'packages'
          $packageName = 'BPP-Android'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null

          ./scripts/write-bpp-build-info.ps1 `
            -PackageDirectory (Join-Path $packageParent $packageName) `
            -Platform android `
            -Variant app-bundle `
            -Branch $env:RELEASE_BRANCH `
            -Configuration $env:ANDROID_CONFIGURATION `
            -SigningCertificateSha256 $env:ANDROID_SIGNING_CERT_SHA256

          # A zip rather than the Linux job's tar.xz: these bundles are fed to Android tooling from
          # whatever desktop the developer has, and .zip opens on all three without extra tools.
          Compress-Archive `
            -LiteralPath (Join-Path $packageParent $packageName) `
            -DestinationPath (Join-Path $assetDir "$packageName.zip") `
            -Force

      - name: Upload Android BPP
        uses: actions/upload-artifact@v6
        with:
          name: BPP-Android
          path: ${{ runner.temp }}/release-assets/BPP-Android.zip
          if-no-files-found: error

  create-preview-package-release:
    name: Create BPP Draft Release
    runs-on: ubuntu-24.04
    needs:
      - build-windows-preview-package
      - build-linux-preview-package
      - build-android-preview-package
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Download package assets
        uses: actions/download-artifact@v7
        with:
          pattern: BPP-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
        run: |
          $branchSlug = $env:RELEASE_BRANCH -replace '[^A-Za-z0-9._-]+', '-'
          $branchSlug = $branchSlug.Trim('-')
          if ([string]::IsNullOrWhiteSpace($branchSlug)) {
            $branchSlug = 'branch'
          }

          $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
          $shortSha = (git rev-parse --short HEAD).Trim()
          $tagName = "broiler-preview-package-$branchSlug-$stamp-$env:GITHUB_RUN_NUMBER"
          $releaseTitle = "Broiler Preview Package draft ($env:RELEASE_BRANCH @ $shortSha)"

          "tag_name=$tagName" >> $env:GITHUB_OUTPUT
          "release_title=$releaseTitle" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ github.event.inputs.branch }}
          TAG_NAME: ${{ steps.metadata.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.metadata.outputs.release_title }}
          SHORT_SHA: ${{ steps.metadata.outputs.short_sha }}
          ANDROID_SIGNING_CERT_SHA256: ${{ needs.build-android-preview-package.outputs.signing-certificate-sha256 }}
        run: |
          $assetDir = Join-Path $env:RUNNER_TEMP 'release-assets'

          function Resolve-Asset {
            param(
              [Parameter(Mandatory=$true)][string]$BaseName,
              [Parameter(Mandatory=$true)][string[]]$Extensions
            )

            foreach ($extension in $Extensions) {
              $candidate = Join-Path $assetDir ($BaseName + $extension)
              if (Test-Path -LiteralPath $candidate) {
                return $candidate
              }
            }

            throw "Missing expected BPP asset for $BaseName. Tried: $($Extensions -join ', ')"
          }

          $windowsFrameworkDependent = Resolve-Asset 'BPP-Win32-framework-dependent' @('.7z', '.zip')
          $windowsSelfContained = Resolve-Asset 'BPP-Win32-self-contained' @('.7z', '.zip')
          $linuxFrameworkDependent = Resolve-Asset 'BPP-Linux-framework-dependent' @('.tar.xz', '.tar.gz')
          $linuxSelfContained = Resolve-Asset 'BPP-Linux-self-contained' @('.tar.xz', '.tar.gz')
          $android = Resolve-Asset 'BPP-Android' @('.zip')

          $packages = @(
            $windowsFrameworkDependent,
            $windowsSelfContained,
            $linuxFrameworkDependent,
            $linuxSelfContained,
            $android
          )

          foreach ($asset in $packages) {
            if (-not (Test-Path -LiteralPath $asset)) {
              throw "Missing expected BPP asset: $asset"
            }
          }

          # sha256sum-compatible manifest (hash, two spaces, file name) so `sha256sum -c` works as-is
          # after downloading the archives next to it.
          $checksumPath = Join-Path $assetDir 'SHA256SUMS.txt'
          $checksumLines = $packages | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $_)
          }
          Set-Content -LiteralPath $checksumPath -Value $checksumLines -Encoding ascii

          $assetList = ($packages + $checksumPath) | ForEach-Object { "- " + (Split-Path -Leaf $_) }

          # Single-quoted here-string: the notes are full of Markdown backticks, and in an
          # interpolating string PowerShell would eat them as escape characters.
          $contents = @'
          Each desktop package (`BPP-Win32-*`, `BPP-Linux-*`) contains:

          * `Broiler.Browser` — the Broiler web browser.
          * `Broiler.Writer` — the Broiler word processor (desktop).
          * `BOSS/` — **Broiler Office Standalone Server**: a Kestrel host that serves the Broiler
            Writer web app (WebAssembly), so the Writer runs in a browser with no other web server
            involved.

          Starting BOSS after extracting a package:

          ```
          ./BOSS/run-boss.sh --urls http://0.0.0.0:5555        # Linux
          BOSS\Start-BOSS.cmd                                  # Windows
          ```

          Then open <http://localhost:5555/>. Liveness probe at `/healthz`, server details at
          `/api/info`.

          To keep it serving across reboots, `BOSS/service/` carries prepared unit files and
          installers — a hardened systemd unit (`Type=notify`), an LSB SysV init script, a Windows
          service installer, plus nginx and Apache reverse-proxy samples:

          ```
          sudo ./BOSS/service/install-service.sh --urls http://0.0.0.0:5555
          powershell -ExecutionPolicy Bypass -File BOSS\service\Install-BossService.ps1 -OpenFirewall
          ```

          Full documentation ships in the package: `BOSS/README.md` and `BOSS/service/README.md`.
          Each package root also carries a `BUILD-INFO.txt` naming the branch, commit and build time.

          Variants:

          * **self-contained** — carries its own .NET runtime; nothing to install.
          * **framework-dependent** — smaller, needs the .NET 10 desktop runtime and, for BOSS, the
            ASP.NET Core 10 runtime on the target machine.
          '@

          $androidNotes = @'
          `BPP-Android.zip` carries the two Android application heads twice — as Release app bundles
          to upload, and as arm64 Release APKs to install:

          * `Broiler.Browser.aab` / `Broiler.Browser-arm64.apk` — application ID `org.broiler.browser`.
          * `Broiler.Writer.aab` / `Broiler.Writer-arm64.apk` — application ID `org.broiler.writer`.

          The bundles carry the `arm64-v8a` and `x86_64` ABIs; the APKs carry `arm64-v8a` alone,
          which is what physical devices run. All four compile against API 36 and declare a minimum
          of API 24, and all four are **signed with the Broiler release key** — held as repository
          secrets, never in the repository — with every signature verified against that key before
          packaging. Each format is signed by the tool that checks it, so check a download the same
          way:

          ```
          jarsigner -verify Broiler.Browser.aab
          apksigner verify --print-certs -v Broiler.Browser-arm64.apk
          ```
          '@

          # A doubled backtick is one literal backtick in an expandable here-string, so the
          # fingerprint lands in the notes as markdown inline code.
          if (-not [string]::IsNullOrWhiteSpace($env:ANDROID_SIGNING_CERT_SHA256)) {
            $androidNotes += @"


          The signing certificate's SHA-256 fingerprint is:

          ``$env:ANDROID_SIGNING_CERT_SHA256``
          "@
          }

          $androidNotes += @'


          To put a build on an arm64 device:

          ```
          adb install -r Broiler.Browser-arm64.apk
          ```

          An `.aab` is not installable as it stands — it is the upload format. For an emulator or a
          device on another ABI, build an APK set from the bundle with Google `bundletool` and
          install that:

          ```
          bundletool build-apks --bundle=Broiler.Browser.aab --output=Broiler.Browser.apks
          bundletool install-apks --apks=Broiler.Browser.apks
          ```

          `bundletool` signs the APKs it generates with its own debug key unless `--ks` says
          otherwise; that is a local install detail and leaves the bundle's own signature untouched.

          Android is an emulator-verified preview; physical-device validation is still outstanding.
          '@

          $verify = @'
          Verify a download against `SHA256SUMS.txt`:

          ```
          sha256sum -c SHA256SUMS.txt --ignore-missing        # Linux
          Get-FileHash .\BPP-Win32-self-contained.7z -Algorithm SHA256   # Windows
          ```
          '@

          $body = @(
            "Draft Broiler Preview Package prepared from branch $env:RELEASE_BRANCH at commit $env:SHORT_SHA.",
            '',
            $contents,
            '',
            $androidNotes,
            '',
            'Assets:',
            ($assetList -join "`n"),
            '',
            $verify
          ) -join "`n"

          $bodyPath = Join-Path $env:RUNNER_TEMP 'broiler-preview-package-notes.md'
          Set-Content -LiteralPath $bodyPath -Value $body -Encoding UTF8

          gh release create $env:TAG_NAME `
            $windowsFrameworkDependent `
            $windowsSelfContained `
            $linuxFrameworkDependent `
            $linuxSelfContained `
            $android `
            $checksumPath `
            --draft `
            --target $env:RELEASE_BRANCH `
            --title $env:RELEASE_TITLE `
            --notes-file $bodyPath
