name: NuGet Packages

# Packs the Broiler component libraries and publishes them to NuGet.org. NuGet.org is the
# only feed: nothing is pushed to GitHub Packages, and there is no dry-run mode here — the
# pack-only validation runs in CI on every push to main and every pull request
# (.github/workflows/nuget-pack.yml, "NuGet pack (dry run)").
# See docs/ROADMAP.md#release-and-distribution.
#
#   * Tag  nuget-v*   -> pack, then publish to NuGet.org (gated by human review).
#   * Manual dispatch -> the same, for re-running a release.
#
# The aggregate compatibility entry point packs Layout, Documents, Media, Input,
# UI and their bundles. A reviewed cohort admission receipt routes verified
# overlapping package IDs to their designated component workflows.

on:
  push:
    tags:
      - 'nuget-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_DIR: ${{ github.workspace }}/artifacts/nupkg

jobs:
  pack:
    name: Pack
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        shell: pwsh
        run: ./scripts/pack-all.ps1 -Output $env:NUGET_DIR

      - name: Upload packages artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            ${{ env.NUGET_DIR }}/*.nupkg
            ${{ env.NUGET_DIR }}/*.snupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org (gated)
    runs-on: ubuntu-24.04
    needs: pack
    environment: nuget-release
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    env:
      COHORT_ADMISSION_RUN: ${{ vars.NUGET_COHORT_ADMISSION_RUN_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: true

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: nupkg

      - name: Verify the admission receipt provenance
        if: env.COHORT_ADMISSION_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          [[ "$COHORT_ADMISSION_RUN" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COHORT_ADMISSION_RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .conclusion == "success" and .event == "workflow_dispatch" and
              .head_branch == "main" and .head_repository.full_name == $repo and
              (.path | split("@")[0]) == ".github/workflows/nuget-cohorts.yml"
            ' >/dev/null

      - uses: actions/download-artifact@v7
        if: env.COHORT_ADMISSION_RUN != ''
        with:
          name: nuget-cohort-admission
          run-id: ${{ env.COHORT_ADMISSION_RUN }}
          github-token: ${{ github.token }}
          path: cohort-receipt

      - uses: actions/setup-python@v6
        if: env.COHORT_ADMISSION_RUN != ''
        with:
          python-version: '3.11'

      - name: Route admitted package IDs to their owners
        if: env.COHORT_ADMISSION_RUN != ''
        id: route
        shell: pwsh
        run: |
          $receipts = @(Get-ChildItem -LiteralPath cohort-receipt -Recurse -File -Filter cohort-admission.json)
          if ($receipts.Count -ne 1) { throw 'Expected one cohort admission receipt' }
          python scripts/nuget_cohorts.py route --archives nupkg --receipt $receipts[0].FullName --output legacy-route.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $route = Get-Content -Raw legacy-route.json | ConvertFrom-Json
          foreach ($item in $route.redirected) {
            "- $($item.id) is published by $($item.publisher)" | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          "remaining=$($route.retain.Count)" >> $env:GITHUB_OUTPUT

      - name: Human-review gate
        if: steps.route.outputs.remaining != '0'
        shell: pwsh
        run: ./scripts/check-publish-approval.ps1

      - name: Setup .NET
        if: steps.route.outputs.remaining != '0'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet.org
        if: steps.route.outputs.remaining != '0'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $names = if (Test-Path -LiteralPath legacy-route.json) {
            (Get-Content -Raw legacy-route.json | ConvertFrom-Json).retain
          } else {
            (Get-ChildItem -LiteralPath nupkg -File -Filter *.nupkg).Name
          }
          foreach ($name in $names) {
            dotnet nuget push (Join-Path nupkg $name) `
              --source 'https://api.nuget.org/v3/index.json' `
              --api-key $env:NUGET_API_KEY `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
