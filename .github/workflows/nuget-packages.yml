name: NuGet Packages

# Packs the Broiler component libraries and publishes them to NuGet.org. NuGet.org is the
# only feed: nothing is pushed to GitHub Packages, and there is no dry-run mode here — the
# pack-only validation runs in CI on every push to main and every pull request
# (.github/workflows/nuget-pack.yml, "NuGet pack (dry run)").
# See docs/ROADMAP.md#release-and-distribution.
#
#   * Tag  nuget-v*   -> pack, then publish to NuGet.org (gated by human review).
#   * Manual dispatch -> the same, for re-running a release.
#
# Every component except Broiler.Layout is now a submodule. This workflow still packs
# the same set — Layout, Documents, Media, Input, UI plus their meta-packages — but it
# reads four of them out of their submodule checkouts, which is why the checkout step
# below needs submodules. Broiler.DOM, Broiler.CSS, Broiler.Graphics, Broiler.HTML and
# Broiler.JS publish from their own repositories and are packed here only behind
# scripts/pack-all.ps1 -IncludeSubmodules.

on:
  push:
    tags:
      - 'nuget-v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-packages-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_DIR: ${{ github.workspace }}/artifacts/nupkg

jobs:
  pack:
    name: Pack
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Pack
        shell: pwsh
        run: ./scripts/pack-all.ps1 -Output $env:NUGET_DIR

      - name: Upload packages artifact
        uses: actions/upload-artifact@v6
        with:
          name: nuget-packages
          path: |
            ${{ env.NUGET_DIR }}/*.nupkg
            ${{ env.NUGET_DIR }}/*.snupkg
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org (gated)
    runs-on: ubuntu-24.04
    needs: pack
    environment: nuget-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Human-review gate
        shell: pwsh
        run: ./scripts/check-publish-approval.ps1

      - uses: actions/download-artifact@v7
        with:
          name: nuget-packages
          path: nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          dotnet nuget push "nupkg/*.nupkg" `
            --source "https://api.nuget.org/v3/index.json" `
            --api-key "${{ secrets.NUGET_API_KEY }}" `
            --skip-duplicate
