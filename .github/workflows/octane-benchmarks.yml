name: Octane Benchmarks

# Runs Google's Octane 2.0 JavaScript benchmark suite (https://github.com/chromium/octane)
# under three engines and commits the comparison back to the repository:
#
#   * Chromium  — real V8 in a headless browser, driven by Playwright.
#   * Broiler   — the BroilerJS `--script-host` shell (the Broiler.JS engine).
#   * Jint      — https://github.com/sebastienros/jint, a managed ECMAScript
#                 interpreter, run through tests/octane/jint-host. The managed
#                 reference point: same runtime, same script, same process shape.
#
# Each Octane suite runs in isolation (a fresh Chromium page / a fresh shell
# process) so a crash, hang, or error in one suite never discards the others —
# Broiler is experimental and some suites do not yet complete.
#
# The `platform` input picks which of the release RIDs to measure on —
# win-x64, linux-x64, linux-arm64, or `all` for the full matrix that
# Broiler.JS/docs/roadmap/Measurement.md §3.1 requires before a result may be claimed.
# Each platform is its own job on its own runner and writes its own results
# directory, tests/octane/results/<platform>/: Octane scores do not carry
# across machines, and the harness folds a previously committed engine result
# back into the comparison, which is only honest within one platform.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: >-
          Release RID to benchmark on. `all` fans out to every one of them —
          three jobs, three results directories, nothing shared.
        type: choice
        required: false
        default: linux-x64
        options:
          - linux-x64
          - win-x64
          - linux-arm64
          - all
      engines:
        description: Comma-separated engines to run (chromium,broiler,jint).
        required: false
        default: 'chromium,broiler,jint'
      timeout_seconds:
        description: >-
          Per-suite timeout floor in seconds. A slow suite (Mandreel, zlib) raises
          its own budget in scripts/octane-suites.json.
        required: false
        default: '180'
      repetitions:
        description: >-
          Run each suite this many times and report the median score plus the
          observed spread. 1 is a single measurement — enough to see whether a
          suite completes, not enough to call a score change real, and a result
          committed at 1 says so in its own header. Pass 1 deliberately for a
          quick coverage check.
        required: false
        default: '3'
      octane_ref:
        description: Git ref of chromium/octane to benchmark.
        required: false
        default: 'master'
      only:
        description: >-
          Comma-separated suites to run (e.g. Crypto,zlib). Leave empty for all.
          A partial run writes to tests/octane/logs/partial and never overwrites
          the committed results.
        required: false
        default: ''
      verbose:
        description: Stream each engine process's output into the job log.
        type: boolean
        required: false
        default: false
      commit_results:
        description: Commit the refreshed results back to the branch.
        type: boolean
        required: false
        default: true

permissions:
  contents: write   # commit the refreshed Octane results

# Keyed by platform as well as ref: a win-x64 dispatch measures something a
# linux-x64 one does not, so it must not cancel it.
concurrency:
  group: octane-${{ github.ref }}-${{ github.event.inputs.platform || 'linux-x64' }}
  cancel-in-progress: true

jobs:
  # Turns the single `platform` input into the matrix the benchmark job runs.
  # Kept as a step rather than a runner-label expression inline in `runs-on` so
  # the RID-to-runner mapping is written once, in one readable place.
  select-platforms:
    name: Select platforms
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Map the requested RIDs to runner labels
        id: select
        env:
          OCTANE_PLATFORM: ${{ github.event.inputs.platform || 'linux-x64' }}
        run: |
          set -euo pipefail

          # The release matrix of Broiler.JS/docs/roadmap/Measurement.md §3.1. linux-arm64
          # is a GitHub-hosted Arm runner; the label is a distinct image, not a
          # ubuntu-latest variant, so it is spelled out rather than derived.
          runner_for() {
            case "$1" in
              linux-x64)   echo 'ubuntu-latest' ;;
              win-x64)     echo 'windows-latest' ;;
              linux-arm64) echo 'ubuntu-24.04-arm' ;;
              *) echo "Unknown platform: $1" >&2; exit 1 ;;
            esac
          }

          case "$OCTANE_PLATFORM" in
            all) platforms='linux-x64 win-x64 linux-arm64' ;;
            *)   platforms="$OCTANE_PLATFORM" ;;
          esac

          entries=''
          for p in $platforms; do
            entries="${entries:+$entries,}{\"platform\":\"$p\",\"runner\":\"$(runner_for "$p")\"}"
          done
          matrix="{\"include\":[$entries]}"

          echo "Benchmarking on: $platforms"
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  benchmark:
    name: Octane (${{ matrix.platform }})
    needs: select-platforms
    strategy:
      # One platform failing must not cancel the measurements already running on
      # the others — a lost three-hour run is the expensive failure here.
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Jint adds about ten minutes to the previous 90: it completes every suite,
    # and its slowest (Mandreel) measured 104s against Broiler's 313s.
    #
    # Sized for the default THREE repetitions (roadmap item 0-6's noise band),
    # not one. Broiler's own 15 suites measured 654 s in the committed run, of
    # which Mandreel and zlib are 499 s between them; with Chromium and Jint
    # beside it a single repetition is roughly 26 minutes of benchmarking on top
    # of a recursive-submodule checkout and a Release build. Tripling the
    # benchmark half lands near 95 minutes, which the previous 105 would have cut
    # off often enough to make the band unobtainable — the failure mode being a
    # run that costs the full 105 minutes and commits nothing. The same budget
    # covers every platform: win-x64 and linux-arm64 have no measured figure of
    # their own yet, and the first runs on them are what will produce one.
    timeout-minutes: 180
    defaults:
      run:
        # The harness is one bash script on every platform; on windows-latest
        # that is Git Bash, which is why the script converts the paths it hands
        # to Node back into native ones.
        shell: bash
    steps:
      # Windows checkouts of a recursively-nested submodule tree hit MAX_PATH
      # before they hit anything interesting. Set before checkout, not after.
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5
        with:
          # Nested submodules are required: without them the Broiler.JS build
          # breaks on the Regex alias. See the broiler-js-nested-submodules note.
          submodules: recursive
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # OCTANE_PLATFORM, not PLATFORM: this step runs `dotnet build`, and MSBuild
      # reads every environment variable as a global property. A variable named
      # PLATFORM therefore sets $(Platform), and any value other than AnyCPU
      # moves the whole build to bin/<platform>/<configuration>/ — the harness
      # then found no bin/Release and every platform's job died before it
      # benchmarked anything. Keep benchmark-harness variables under a prefix no
      # MSBuild property answers to.
      - name: Run Octane benchmarks
        env:
          OCTANE_PLATFORM: ${{ matrix.platform }}
          OCTANE_ONLY: ${{ github.event.inputs.only }}
          OCTANE_VERBOSE: ${{ github.event.inputs.verbose }}
        run: |
          args=(
            --platform "$OCTANE_PLATFORM"
            --engines "${{ github.event.inputs.engines || 'chromium,broiler,jint' }}"
            --timeout "${{ github.event.inputs.timeout_seconds || '180' }}"
            --repetitions "${{ github.event.inputs.repetitions || '3' }}"
            --octane-ref "${{ github.event.inputs.octane_ref || 'master' }}"
          )
          [ -n "$OCTANE_ONLY" ] && args+=(--only "$OCTANE_ONLY")
          [ "$OCTANE_VERBOSE" = "true" ] && args+=(--verbose)
          bash scripts/run-octane-benchmarks.sh "${args[@]}"

      - name: Publish comparison and failure diagnostics to job summary
        if: always()
        env:
          OCTANE_PLATFORM: ${{ matrix.platform }}
        run: |
          # With `all` dispatched, three jobs write into one summary; each says
          # up front which machine it is reporting on.
          echo "## $OCTANE_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
          for f in "tests/octane/results/$OCTANE_PLATFORM/comparison.md" \
                   "tests/octane/results/$OCTANE_PLATFORM/diagnostics.md"; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: octane-results-${{ matrix.platform }}
          path: tests/octane/results/${{ matrix.platform }}/

      # The per-suite logs hold the whole story for a failing suite — full
      # stdout/stderr, the exit code, the phase it died in, and the combined
      # script that reproduces it. They are gitignored, so CI keeps them here.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: octane-logs-${{ matrix.platform }}
          path: tests/octane/logs/
          if-no-files-found: ignore

      # A benchmarking job runs for hours, so the branch it was dispatched from
      # has usually moved by the time it has something to commit — a plain push
      # is rejected as non-fast-forward and the whole run's measurements are
      # lost. The helper rebuilds the commit on the current tip and retries.
      #
      # Under `all` the three jobs commit concurrently, and that is safe: each
      # names only its own results directory, and the helper replaces exactly
      # the paths it is given on top of whatever the tip has become — so the
      # win-x64 job's commit carries the linux-x64 job's results forward
      # untouched rather than reverting them.
      - name: Commit results
        if: ${{ github.event.inputs.commit_results != 'false' }}
        run: |
          bash scripts/ci-commit-generated-results.sh \
            --branch "${{ github.ref_name }}" \
            --message "ci: update Octane benchmark results (${{ matrix.platform }}) [skip ci]" \
            "tests/octane/results/${{ matrix.platform }}/"
