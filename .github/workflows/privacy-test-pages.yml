name: Privacy Test Pages

# Coverage suite over the DuckDuckGo privacy test pages
# (https://github.com/duckduckgo/privacy-test-pages). Each page runs its own
# probes and publishes them in a `results` global. Every page is run twice from
# the same manifest — once by Chromium through Playwright and once by Broiler.Cli
# with --evaluate-page — and the two `results` payloads are compared probe by
# probe. The runner classifies every probe as carried out or not, diffs that
# against tests/privacy-test-pages/baseline.json, and reports every probe
# Chromium answered that Broiler did not as a gap with the expected value beside
# it.
#
# The corpus is live and maintained upstream, so it is not a pull-request gate:
# tests are added and removed without a Broiler code change. A scheduled run
# fails only on a regression against the tracked baseline — a probe that used to
# produce a value and no longer does, or a page that stops running altogether.
# Gaps behind Chromium are reported, never failed on: they are the backlog this
# suite exists to describe, not a change this run introduced.
#
# Like the WPT runners, a run files what it found as GitHub issues rather than
# leaving it in an artifact that expires — three of them, each answering a
# different question, because ranking them together would bury the two small ones
# under the large one:
#
#   1. the regressions (probes that stopped producing a value, pages that stopped
#      running) — the only one describing a change this repository made;
#   2. the pages this run could not measure at all, whose zero gaps otherwise read
#      like the zero of a page in full parity;
#   3. the probes Chromium answers and Broiler does not, grouped by thrown-error
#      signature and by page, so one fix reads as one row.
#
# Unlike the WPT runners, which a human dispatches and then reads, this suite runs
# weekly and unattended over a backlog that changes slowly, so a run refreshes the
# issue already open for a kind rather than filing a near-identical copy beside
# it. Each body carries a hidden marker naming its kind, and
# scripts/lib/github-issue.js matches on it. run-privacy-test-pages.py decides
# what is worth filing and writes the bodies, so the rules live with the runner
# that measured them rather than in a second, drifting copy here.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: Comma-separated page IDs from tests/privacy-test-pages/pages.json; empty runs all pages.
        required: false
        default: ''
      fail_on_regression:
        description: Fail the workflow when a probe stops producing a value.
        type: boolean
        required: false
        default: true
      fail_on_incomplete:
        description: Fail the workflow when any page cannot be evaluated at all.
        type: boolean
        required: false
        default: false
      require_reference:
        description: Fail the workflow when any page could not be captured in Chromium to compare against.
        type: boolean
        required: false
        default: false
      skip_reference:
        description: Skip the Chromium capture and run Broiler only.
        type: boolean
        required: false
        default: false
      update_baseline:
        description: Rewrite the baseline from this run and upload it as an artifact instead of comparing.
        type: boolean
        required: false
        default: false
      create_issues:
        description: >
          File (or refresh) the GitHub issues for this run's regressions, unmeasured
          pages and gaps behind Chromium. A baseline rewrite never files any.
        type: boolean
        required: false
        default: true
      gap_issue_limit:
        description: >
          Maximum thrown-error signatures and pages to rank in the gaps issue.
        required: false
        default: '10'
      regression_issue_limit:
        description: Maximum regressed probes to list per page in the regressions issue.
        required: false
        default: '20'
  schedule:
    # Weekly. The pages are public, third-party, and change independently of
    # this repository, so a per-commit run would report their churn as ours.
    - cron: '41 5 * * 2'

permissions:
  contents: read
  issues: write   # the run files its findings as issues

env:
  RESULTS_DIR: artifacts/privacy-test-pages
  NODE_PATH: ${{ github.workspace }}/tests/wpt/node_modules
  GAP_ISSUE_LIMIT: ${{ github.event.inputs.gap_issue_limit || '10' }}
  REGRESSION_ISSUE_LIMIT: ${{ github.event.inputs.regression_issue_limit || '20' }}

jobs:
  evaluate:
    name: Evaluate the privacy test pages
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The tested pages are untrusted live inputs whose scripts this job
          # executes. Do not leave the job's token in git's credential config
          # while that happens.
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/wpt/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Apply pending renderer patches
        shell: bash
        run: bash scripts/apply-pending-wpt-patches.sh

      - name: Restore Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: wpt-playwright-${{ runner.os }}-${{ hashFiles('tests/wpt/package-lock.json') }}
          restore-keys: wpt-playwright-${{ runner.os }}-

      - name: Install the reference browser
        if: github.event.inputs.skip_reference != 'true'
        shell: bash
        run: |
          (
            cd tests/wpt
            npm ci
            if ! timeout 20m npx playwright install --with-deps chromium; then
              echo "::warning::Chromium installation did not complete; the run will report its pages as uncompared."
            fi
          )

      - name: Test the runner
        shell: bash
        run: |
          python -m unittest scripts.tests.test_run_privacy_test_pages -v
          node --test scripts/tests/capture-privacy-reference.test.js
          node --test scripts/tests/github-issue.test.js

      - name: Build Broiler.Cli
        shell: bash
        run: dotnet build src/Broiler.Cli/Broiler.Cli.csproj -c Release

      - name: Run the privacy test pages
        id: evaluate
        shell: bash
        env:
          PRIVACY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_PAGES: ${{ github.event.inputs.pages || '' }}
          FAIL_ON_REGRESSION: ${{ github.event.inputs.fail_on_regression || 'true' }}
          FAIL_ON_INCOMPLETE: ${{ github.event.inputs.fail_on_incomplete || 'false' }}
          REQUIRE_REFERENCE: ${{ github.event.inputs.require_reference || 'false' }}
          SKIP_REFERENCE: ${{ github.event.inputs.skip_reference || 'false' }}
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline || 'false' }}
        run: |
          args=(
            --output-dir "$RESULTS_DIR"
            --skip-build
            --github-output "$GITHUB_OUTPUT"
            --gap-issue-limit "$GAP_ISSUE_LIMIT"
            --regression-issue-limit "$REGRESSION_ISSUE_LIMIT"
          )
          if [ -n "$SELECTED_PAGES" ]; then
            args+=(--pages "$SELECTED_PAGES")
          fi
          if [ "$SKIP_REFERENCE" = "true" ]; then
            args+=(--no-reference)
          elif [ "$REQUIRE_REFERENCE" = "true" ]; then
            args+=(--require-reference)
          fi
          if [ "$UPDATE_BASELINE" = "true" ]; then
            args+=(--update-baseline)
          else
            if [ "$FAIL_ON_REGRESSION" = "true" ]; then
              args+=(--fail-on-regression)
            fi
            if [ "$FAIL_ON_INCOMPLETE" = "true" ]; then
              args+=(--fail-on-incomplete)
            fi
          fi
          python scripts/run-privacy-test-pages.py "${args[@]}"

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULTS_DIR/job-summary.md" ]; then
            cat "$RESULTS_DIR/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "[Open this workflow run and its artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Privacy test pages" >> "$GITHUB_STEP_SUMMARY"
            echo "The runner stopped before it could create a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The gap report is what a reader turns into an issue, so it goes to the
      # log as well as the artifact: the log survives artifact expiry and can be
      # read without downloading a zip.
      - name: Print the Chromium comparison
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULTS_DIR/reference.log" ]; then
            echo "--- Chromium capture ---"
            cat "$RESULTS_DIR/reference.log"
            echo
          fi
          if [ -f "$RESULTS_DIR/gaps.md" ]; then
            cat "$RESULTS_DIR/gaps.md"
          else
            echo "No gap report was produced."
          fi

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: privacy-test-pages-results
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30

      # One step for all three issues rather than one step each: the runner has
      # already decided which of them are findings and written their titles and
      # bodies, so a step per issue would only restate that decision in YAML.
      # `!cancelled()` rather than `always()`: a run that fails on a regression is
      # exactly the run whose issue still has to be filed, but a run a human
      # cancelled measured only part of the corpus and should file nothing.
      - name: File the run's findings as GitHub issues
        if: >-
          !cancelled()
          && github.event.inputs.create_issues != 'false'
          && steps.evaluate.outputs.issue_count != '0'
        uses: actions/github-script@v8
        with:
          # Prefer the configured PAT/App token, then use this workflow's token.
          github-token: ${{ secrets.ISSUE_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const { createOrUpdateIssue } =
              require(`${process.env.GITHUB_WORKSPACE}/scripts/lib/github-issue.js`);

            const indexPath = path.join(process.env.RESULTS_DIR, 'issues', 'index.json');
            if (!fs.existsSync(indexPath)) {
              core.warning(
                `No issue index at ${indexPath}: the runner stopped before it could decide ` +
                'what this run found.');
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const index = JSON.parse(fs.readFileSync(indexPath, 'utf8'));
            const filed = index.issues.filter(issue => issue.create);
            if (filed.length === 0) {
              core.info('Nothing to file: this run found no regression, no unmeasured page and no gap.');
              return;
            }

            for (const entry of filed) {
              const body = fs.readFileSync(
                path.join(process.env.RESULTS_DIR, entry.body), 'utf8').trim();
              const result = await createOrUpdateIssue({
                github,
                owner: context.repo.owner,
                repo: context.repo.repo,
                marker: entry.marker,
                title: entry.title,
                body,
                runUrl,
              });
              core.info(`${result.action} the ${entry.kind} issue #${result.number}: ${result.url}`);
            }

      - name: Upload the regenerated baseline
        if: always() && github.event.inputs.update_baseline == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: privacy-test-pages-baseline
          path: tests/privacy-test-pages/baseline.json
          if-no-files-found: warn
          retention-days: 30
