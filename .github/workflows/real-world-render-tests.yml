name: Real-world Website Render Tests

# Observational rendering suite for public websites. Unlike WPT, these inputs
# change independently of this repository, so the workflow records complete
# evidence and reports quality failures without making the weekly run a release
# gate by default. A manual run can opt into threshold/incomplete-run failure.

on:
  workflow_dispatch:
    inputs:
      sites:
        description: Comma-separated site IDs from tests/real-world-sites/sites.json; empty runs all sites.
        required: false
        default: ''
      pixel_match_threshold:
        description: Minimum full-viewport pixel match percentage; empty uses the manifest.
        required: false
        default: ''
      content_match_threshold:
        description: Minimum non-background content match percentage; empty uses the manifest.
        required: false
        default: ''
      structure_match_threshold:
        description: Minimum one-pixel-tolerant edge/structure match percentage; empty uses the manifest.
        required: false
        default: ''
      fail_on_mismatch:
        description: Fail the workflow when a comparable site misses a quality threshold.
        type: boolean
        required: false
        default: false
      fail_on_incomplete:
        description: Fail the workflow when any site cannot be captured and compared.
        type: boolean
        required: false
        default: false
      memory_limit_mb:
        description: Per-capture Broiler process-tree RSS limit in MiB; 0 disables it.
        required: false
        default: '1024'
  schedule:
    # Weekly rather than per-commit: this suite contacts public sites and its
    # dynamic pages are not appropriate as a required pull-request check.
    - cron: '23 4 * * 1'

permissions:
  contents: read

env:
  RESULTS_DIR: artifacts/real-world-render-tests
  NODE_PATH: ${{ github.workspace }}/tests/wpt/node_modules

jobs:
  render:
    name: Capture and compare public websites
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # The tested pages are untrusted live inputs. Do not leave the job's
          # read token in git's credential configuration while Broiler executes
          # their scripts.
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/wpt/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/real-world-sites/requirements.txt

      - name: Apply pending renderer patches
        shell: bash
        run: bash scripts/apply-pending-wpt-patches.sh

      - name: Restore Playwright browser
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: wpt-playwright-${{ runner.os }}-${{ hashFiles('tests/wpt/package-lock.json') }}
          restore-keys: wpt-playwright-${{ runner.os }}-

      - name: Install capture dependencies
        shell: bash
        run: |
          python -m pip install --requirement tests/real-world-sites/requirements.txt
          (
            cd tests/wpt
            npm ci
            if ! timeout 20m npx playwright install --with-deps chromium; then
              echo "::warning::Chromium installation did not complete; the runner will publish an incomplete-capture report."
            fi
          )

      - name: Test render harness
        shell: bash
        run: |
          python -m unittest scripts.tests.test_real_world_render_tests -v
          node --test scripts/tests/generate-real-world-references.test.js

      - name: Run real-world render tests
        shell: bash
        env:
          SELECTED_SITES: ${{ github.event.inputs.sites || '' }}
          PIXEL_THRESHOLD: ${{ github.event.inputs.pixel_match_threshold || '' }}
          CONTENT_THRESHOLD: ${{ github.event.inputs.content_match_threshold || '' }}
          STRUCTURE_THRESHOLD: ${{ github.event.inputs.structure_match_threshold || '' }}
          FAIL_ON_MISMATCH: ${{ github.event.inputs.fail_on_mismatch || 'false' }}
          FAIL_ON_INCOMPLETE: ${{ github.event.inputs.fail_on_incomplete || 'false' }}
          MEMORY_LIMIT_MB: ${{ github.event.inputs.memory_limit_mb || '1024' }}
        run: |
          args=(
            --output-dir "$RESULTS_DIR"
            --memory-limit-mb "$MEMORY_LIMIT_MB"
          )
          if [ -n "$PIXEL_THRESHOLD" ]; then
            args+=(--pixel-match-threshold "$PIXEL_THRESHOLD")
          fi
          if [ -n "$CONTENT_THRESHOLD" ]; then
            args+=(--content-match-threshold "$CONTENT_THRESHOLD")
          fi
          if [ -n "$STRUCTURE_THRESHOLD" ]; then
            args+=(--structure-match-threshold "$STRUCTURE_THRESHOLD")
          fi
          if [ -n "$SELECTED_SITES" ]; then
            args+=(--sites "$SELECTED_SITES")
          fi
          if [ "$FAIL_ON_MISMATCH" = "true" ]; then
            args+=(--fail-on-mismatch)
          fi
          if [ "$FAIL_ON_INCOMPLETE" = "true" ]; then
            args+=(--fail-on-incomplete)
          fi
          python scripts/run-real-world-render-tests.py "${args[@]}"

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RESULTS_DIR/job-summary.md" ]; then
            cat "$RESULTS_DIR/job-summary.md" >> "$GITHUB_STEP_SUMMARY"
            echo "[Open this workflow run and its artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Real-world website render tests" >> "$GITHUB_STEP_SUMMARY"
            echo "The runner stopped before it could create a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload detailed render evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-world-render-results
          path: ${{ env.RESULTS_DIR }}
          if-no-files-found: warn
          retention-days: 30
