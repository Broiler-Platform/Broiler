name: Script tests

# The unit tests under scripts/tests/ — six Python suites and four Node ones — that had no
# runner on a pull request.
#
# Four of the ten were invoked somewhere: test_run_privacy_test_pages,
# capture-privacy-reference and github-issue from privacy-test-pages.yml, and
# test_real_world_render_tests with generate-real-world-references from
# real-world-render-tests.yml. But both of those workflows are workflow_dispatch and
# schedule only, so none of them gates a change. A script could break its tests and merge
# green, with the breakage surfacing days later inside an expensive run that exists to
# measure something else entirely. The other six — generate-wpt-references among them — ran
# nowhere at all.
#
# So these jobs are deliberately small and fast: no submodules, no .NET, no browsers, no npm
# install, and a three-package pip install that one Python suite needs. Every suite drives
# its script inside a temporary directory, and every script under Node test here imports
# only node: builtins, so none of the heavy setup the owning workflows perform is required.
# Both jobs finish in well under a minute, which is what makes them reasonable on every pull
# request that touches scripts/.
#
# The two dispatch workflows keep their own steps. Running a suite twice costs seconds and
# means a dispatched run still checks its own harness before spending an hour on it.

on:
  pull_request:
    paths:
      # The scripts and their tests, and this file. Not '**' — these suites test scripts/
      # and nothing else, so a renderer or WPT change cannot affect their result.
      - 'scripts/**'
      - '.github/workflows/script-tests.yml'
      # The pinned requirements installed below. Not a script, but this job fails
      # without them, so a change to them has to re-run it.
      - 'tests/real-world-sites/requirements.txt'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        # No submodules. Nothing under scripts/tests/ reads a component checkout; the
        # suites build their own fixtures in temporary directories.

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/real-world-sites/requirements.txt

      # One suite imports numpy: test_real_world_render_tests drives the render harness's
      # image comparison, which is numpy the whole way down. The rest need nothing, so this
      # installs the render harness's own pinned requirements rather than a list invented
      # here — the same file real-world-render-tests.yml installs, so the two cannot drift.
      # It is a wheel install of three packages, cached above.
      - name: Install the render harness requirements
        run: python -m pip install --requirement tests/real-world-sites/requirements.txt

      # Discovery rather than a list of module names: a new scripts/tests/test_*.py is then
      # picked up by existing, not by also remembering to name it here. A runner you have
      # to update by hand reintroduces the very gap this job closes, one file at a time.
      #
      # --start-directory rather than `discover -t .`: scripts/tests has no __init__.py, so
      # unittest will not accept the repository root as the top-level directory — it
      # refuses with "Start directory is not importable".
      #
      # The count is checked first for the same reason the Node job checks it: unittest
      # exits zero when discovery matches nothing, so a change that stopped matching would
      # leave this job green while testing nothing at all. A file that matches but cannot
      # be imported already fails the run — that is how the missing numpy was caught — so
      # the empty case is the only silent one, and this closes it.
      - name: Run the Python script tests
        shell: bash
        run: |
          shopt -s nullglob
          suites=(scripts/tests/test_*.py)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::No Python suites matched scripts/tests/test_*.py"
            exit 1
          fi
          echo "Discovering ${#suites[@]} suite(s): ${suites[*]}"
          python -m unittest discover \
            --start-directory scripts/tests \
            --pattern 'test_*.py' \
            --verbose

  node:
    name: Node script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        # No submodules, and no npm install: every script these suites exercise imports
        # only node: builtins at load time. Playwright is reached at run time, by code
        # paths the tests stub rather than execute.

      - uses: actions/setup-node@v5
        with:
          # The version the two dispatch workflows already pin, so a suite cannot pass
          # here and fail there on a runtime difference.
          node-version: '20'

      # The shell expands the suites rather than `node --test scripts/tests/`, for one
      # reason: the empty case. Node's runner exits zero when it finds nothing, so a
      # discovery change that stopped matching would turn this job green while testing
      # nothing at all — the exact failure it exists to prevent, wearing a passing badge.
      # The guard makes that loud. `nullglob` is what lets the count reach zero instead of
      # handing node an unexpanded pattern.
      - name: Run the Node script tests
        shell: bash
        run: |
          shopt -s nullglob
          suites=(scripts/tests/*.test.js)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::No Node suites matched scripts/tests/*.test.js"
            exit 1
          fi
          echo "Running ${#suites[@]} suite(s): ${suites[*]}"
          node --test "${suites[@]}"
